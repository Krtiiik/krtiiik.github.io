<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% seo %}
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<meta name="theme-color" content="#F5F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
<script>
  // Runs before first paint so a saved theme never flashes the other one.
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var theme = null;
    try { theme = localStorage.getItem('krtiiik-theme'); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preload" href="{{ '/assets/fonts/unbounded-var-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/stylesheet.css' | relative_url }}">
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
