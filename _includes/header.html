<header class="site-header">
  <div class="brand">
    <span class="scene-switch" aria-hidden="true"><span class="scene-dot"></span></span>
    <a class="wordmark" href="{{ '/' | relative_url }}">krtiiik</a>
  </div>

  <nav class="site-nav" aria-label="Main">
    {% for item in site.nav_pages %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {% endfor %}{% for item in site.nav_external %}<a href="{{ item.url }}">{{ item.title }}</a>
    {% endfor %}
  </nav>

  <div class="controls">
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch theme" title="Switch theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
